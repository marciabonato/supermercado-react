name: CI Supermercado

# Workflow de Integração Contínua (CI) para a aplicação de supermercado.
# Disparado automaticamente em eventos de push e pull request na branch main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Pipeline de CI
    runs-on: ubuntu-latest

    # Define o diretório de trabalho padrão como a pasta 'supermercado'
    defaults:
      run:
        working-directory: supermercado

    steps:
      # Etapa 1: Checkout do repositório
      # Baixa o código fonte do repositório para o ambiente de execução do GitHub Actions.
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Etapa 2: Configuração do ambiente Node.js
      # Configura a versão do Node.js (24.x LTS) e ativa o cache de dependências usando o Yarn.
      - name: Configuração do ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: |
            supermercado/yarn.lock
            supermercado/backend/ServeRest/yarn.lock

      # Etapa 3: Instalação das dependências
      # Instala as dependências da aplicação web e do servidor local backend (ServeRest).
      - name: Instalação das dependências
        run: |
          yarn install --frozen-lockfile
          yarn --cwd backend/ServeRest install --frozen-lockfile

      # Etapa 4: Reset do Banco de Dados antes dos testes começarem
      # Garante que o banco de dados local fictício inicie limpo e padronizado.
      - name: Resetar Banco de Dados Local
        run: yarn db:reset

      # Etapa 5: Execução dos Testes Unitários
      # Executa a suíte de testes unitários com Vitest em modo de execução única (run).
      - name: Execução dos Testes Unitários
        run: yarn test:run

      # Etapa 6: Instalação dos navegadores do Playwright
      # Instala os navegadores do Playwright juntamente com suas dependências de sistema.
      - name: Instalação dos navegadores do Playwright
        run: yarn playwright install --with-deps

      # Etapa 7: Execução dos Testes E2E
      # O próprio Playwright subirá o servidor interno na porta 3000 sem colisões.
      - name: Execução dos Testes E2E
        run: yarn test:e2e

